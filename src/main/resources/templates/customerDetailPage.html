<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>신청자 상세보기 - 탭형</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background:#f6f8fb;
      font-family:'Noto Sans KR',sans-serif;
    }
    .tab-content {
      background:white;
      padding:2rem;
      border-radius:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.05);
    }
    .form-control-plaintext {
      background-color: #f9f9f9;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      color: #333;
    }
    .option-badge {
      display:inline-block;
      background-color:#444;
      color:white;
      border-radius:12px;
      padding:0.35rem 0.8rem;
      margin:0.25rem;
      font-size:0.9rem;
    }
    img {
      border-radius:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
      transition:transform 0.2s;
    }
    img:hover {
      transform:scale(1.03);
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h3 class="fw-bold mb-4">신청자 상세보기</h3>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#info">신청자 정보</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#content">신청 내용</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#image">이미지 관리</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#delivery">배송</a></li>
    </ul>

    <div class="tab-content">
      <!-- ✅ 신청자 정보 -->
      <div class="tab-pane fade show active" id="info">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">신청자명</label>
            <p class="form-control-plaintext" th:text="${customerReadApply.ct_name}">이름</p>
          </div>
          <div class="col-md-4">
            <label class="form-label">연락처</label>
            <p class="form-control-plaintext" th:text="${customerReadApply.ct_phone}">010-0000-0000</p>
          </div>
          <div class="col-md-4">
            <label class="form-label">택배</label>
            <p class="form-control-plaintext" th:text="${totalSums['do_name']}">택배</p>
          </div>
        </div>

        <label class="form-label">주소</label>
        <p class="form-control-plaintext" th:text="${customerReadApply.ct_address}">서울특별시 강남구 신사동</p>
      </div>

      <!-- ✅ 신청 내용 -->
      <div class="tab-pane fade" id="content">
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">타입</label>
            <p class="form-control-plaintext" th:text="${totalSums['mp_explain']}">타입</p>
          </div>
          <div class="col-md-3">
            <label class="form-label">개수</label>
            <p class="form-control-plaintext" th:text="${customerReadApply.ct_how_many}">3개</p>
          </div>
          <div class="col-md-6">
            <label class="form-label">유료 옵션</label>
            <div>
              <span th:each="opt : ${customerReadOptions}" class="option-badge">
                <span th:text="${opt.po_name}">옵션명</span>
                (<span th:text="${opt.po_extra_price}">0</span>원)
              </span>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">신청일</label>
            <p class="form-control-plaintext"
               th:text="${customerReadApply.ct_apply_date.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd'))}"></p>
          </div>
          <div class="col-md-6">
            <label class="form-label">마감일</label>
            <p class="form-control-plaintext"
               th:text="${customerReadApply.ct_end_date.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd'))}"></p>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">작업 시 유의사항</label>
          <p class="form-control-plaintext" th:text="${customerReadApply.ct_memo}">메모</p>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">캐릭터 이름</label>
            <p class="form-control-plaintext" th:text="${customerReadApply.ct_char}">캐릭터</p>
          </div>
          <div class="col-md-6">
            <label class="form-label">캐릭터 설명</label>
            <p class="form-control-plaintext" th:text="${customerReadApply.ct_char_explain}">설명</p>
          </div>
        </div>

        <div>
          <label class="form-label">총 가격</label>
          <p class="form-control-plaintext fw-bold text-primary fs-5" th:text="${totalSums['total_price']}">₩120,000</p>
        </div>
      </div>

      <!-- ✅ 이미지 관리 -->
      <div class="tab-pane fade" id="image">
        <div class="mb-3">
          <label class="form-label">자료 이미지</label>
          <div th:each="data : ${readCustomerImgData}">
            <img th:src="@{|/somUploadFiles/${data.ci_img_url}|}" alt="도안 이미지" class="img-fluid my-2" />
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">도안 이미지</label>
            <input class="form-control" type="file" name="imageFiles" multiple>
            <button class="btn btn-primary w-100 mt-2">도안컨펌 완료</button>
          </div>
          <div class="col-md-4">
            <label class="form-label">면피 이미지</label>
            <input class="form-control" type="file" name="imageFiles" multiple>
            <button class="btn btn-primary w-100 mt-2">면피컨펌 완료</button>
          </div>
          <div class="col-md-4">
            <label class="form-label">완성 이미지</label>
            <input class="form-control" type="file" name="imageFiles" multiple>
            <button class="btn btn-primary w-100 mt-2">완성컨펌 완료</button>
          </div>
        </div>
      </div>

      <!-- ✅ 배송 -->
      <div class="tab-pane fade" id="delivery">
        <div class="row g-3 align-items-center">
          <div class="col-md-9">
            <input class="form-control" type="text" placeholder="운송장 번호 입력">
          </div>
          <div class="col-md-3">
            <button class="btn btn-success w-100">배송완료</button>
          </div>
        </div>
      </div>
    </div>

    <div class="text-end mt-4">
      <button class="btn btn-secondary px-4">수정</button>
      <button class="btn btn-danger px-4">삭제</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
