<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>원단 상세보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
    height: 100%;
    margin: 0;
    padding: 0;
    }
    .sidebar {
  background-color: #111;
  color: #fff;
  padding-top: 2rem;
  text-align: center;
  min-height: 100vh;
}
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .form-label{
      font-weight: bold;
      
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const previewMap = {
        fb_name: 'previewName',
        fb_color: 'previewColor',
        fb_type : 'previewType',
        fb_thickness: 'previewThickness',
        fb_price: 'previewPrice',
        fb_source_supply : 'previewSupply',
        fb_location : 'previewLocation'
      };

      Object.entries(previewMap).forEach(([inputName, previewId]) => {
        const input = document.querySelector(`[name="${inputName}"]`);
        const preview = document.getElementById(previewId);

        if (input && preview) {
          input.addEventListener('input', function () {
            preview.textContent = input.value || '-';
          });
        }
      });
    });


    document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
    }
  });

  </script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-1 sidebar">
        <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="header-main">
          <h3 class="fw-bold">원단상세보기</h3>
          <div>
            <span class="fw-semibold" th:text="${adminName}"></span>
            <span>님 오늘도 안전히 작업하세요.</span>
          </div>
        </div>

        <!-- form  -->
        <form action="./editFabricProcess" method="post" enctype="multipart/form-data">
          <input type="hidden" name="fb_id_pk" th:value="${fabric.fb_id_pk}" />
          <input type="hidden" name="seq_num" th:value="${adminPk}" />
          <div class="row">
            <!-- 왼쪽 입력 영역 -->
            <div class="col-md-10 offset-md-1">
              <div class="mb-4">
                <div class="row align-items-stretch" style="margin-top: 0.8em;">
                  <!-- 이미지 -->
                  <div class="col">
                      <div th:if="${fabric != null and fabric['fb_swatch_img_path'] != null}">
                      <img th:src="@{|/somUploadFiles/${fabric['fb_swatch_img_path']}|}" alt="스와치 이미지" class="img-fluid h-100" style="object-fit: cover;" />
                    </div>
                    <div th:unless="${fabric != null and fabric['fb_swatch_img_path'] != null}">
                      이미지가 없습니다.
                    </div>


                  </div>

                  <!-- 오른쪽 정보 및 버튼 -->
                  <div class="col d-flex flex-column justify-content-between">
                    <!-- 입고현황 -->
                    <div>
                      <span th:text="${fabric.fb_stock_situation}" style="font-weight: bold;"></span>
                    </div>

                    <!-- 입고완료 버튼 -->
                    <div>
                      <a th:href="@{./updateStock(fb_id_pk=${fabric.fb_id_pk})}" class="btn btn-outline-success w-100">입고완료</a>
                    </div>
                  </div>
                </div>
              <div class="mb-4">
                <label class="form-label">원단명</label>
                <input type="text" class="form-control"  name="fb_name" th:value="${fabric.fb_name}" >
              </div>
              <div class="mb-4">
                <label class="form-label">원단 재질</label>
                <select class="form-select" name="fb_type">
                <option selected th:text="'현재: ' + ${fabric.fb_type}" th:value="${fabric.fb_type}">현재: -</option>
                <option th:each="choiceType : ${fabricCategoryName}"
                        th:if="${choiceType.fc_ct_name != fabric.fb_type}"
                        th:value="${choiceType.fc_ct_name}"
                        th:text="${choiceType.fc_ct_name}">
                </option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">가로 폭</label>
                  <input type="text" class="form-control" name="fb_width" th:value="${fabric.fb_width}">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">세로 폭</label>
                  <input type="text" class="form-control" name="fb_height" th:value="${fabric.fb_height}">
                </div>
              </div>

              <div class="mb-4">
                  <label class="form-label">컬러계열 선택</label>
                  <select class="form-select" name="fb_color">
                    <option disabled th:selected="${fabric.fb_color == null}">컬러계열 선택</option>
                    <option th:value="Red" th:selected="${fabric.fb_color == 'Red'}">빨강</option>
                    <option th:value="Orange" th:selected="${fabric.fb_color == 'Orange'}">주황</option>
                    <option th:value="Yellow" th:selected="${fabric.fb_color == 'Yellow'}">노랑</option>
                    <option th:value="Green" th:selected="${fabric.fb_color == 'Green'}">초록</option>
                    <option th:value="Blue" th:selected="${fabric.fb_color == 'Blue'}">파랑</option>
                    <option th:value="Navy" th:selected="${fabric.fb_color == 'Navy'}">남색</option>
                    <option th:value="Purple" th:selected="${fabric.fb_color == 'Purple'}">보라</option>
                    <option th:value="White" th:selected="${fabric.fb_color == 'White'}">흰색</option>
                    <option th:value="Gray" th:selected="${fabric.fb_color == 'Gray'}">회색</option>
                    <option th:value="Black" th:selected="${fabric.fb_color == 'Black'}">검정</option>
                  </select>

                </div>


              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단두께</label>
                  <input type="text" class="form-control" name="fb_thickness" th:value="${fabric.fb_thickness}">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단위치</label>
                  <input type="text" class="form-control" name="fb_location"   th:value="${fabric.fb_location}">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">공급처 및 단가</label>
                <input type="text" class="form-control" name="fb_source_supply"  th:value="${fabric.fb_source_supply}">
                <input type="text" class="form-control mt-2" name="fb_price" th:value="${fabric.fb_price}">
              </div>

              <div class="mb-4">
                <label class="form-label">스와치 이미지 등록</label>
                <input class="form-control" type="file" name="imageFiles">
              </div>

              <div class="mb-4">
                <label class="form-label">최초 등록일</label>
                <div class="row">
                  <div class="col">
                    <span th:text="${fabric.fb_created_at}"></span>
                  </div>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">마지막 수정일</label>
                <div class="row">
                  <div class="col">
                    <div th:if="${fabric['fb_last_inert_date_at'] == null}"><span th:text="${fabric['fb_created_at']}"></span></div>
                    <div th:unless="${fabric['fb_last_inert_date_at'] == null}"><span th:text="${fabric['fb_last_inert_date_at']}"></span></div>
                  </div>
                </div>
              </div>

              <div class="mb-4">
                <div class="row" style="margin-top: 0.9em;">
                  <div class="col">
                    <a th:href="@{./fabricManagerPage}" class="btn btn-outline-dark w-100" >목록으로</a>
                  </div>
                  <div class="col">
                    <button type="submit" class="btn btn-dark w-100">수정하기</button>
                  </div>
                  <div class="col">
                    <a th:href="@{./deleteFabricsProcess(fb_id_pk=${fabric.fb_id_pk})}"
                      class="btn btn-outline-danger w-100"
                      onclick="return confirm('정말 삭제하시겠습니까?')">
                      원단삭제
                    </a>
                  </div>
                </div>
              </div>

            </div>



          </div>
        </form>

      </div>
    </div>
  </div>
</body>
</html>
