<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>원단관리 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
      font-family: 'Segoe UI', sans-serif;
    }
    .sidebar {
      height: 100vh;
      background-color: #111;
      color: #fff;
      padding-top: 2rem;
      text-align: center;
    }
    .sidebar a, .sidebar i {
      color: #fff;
      display: block;
      margin: 2rem auto;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .sidebar a.active {
      color: #6f42c1;
    }
    .sidebar a:hover {
      color: #6f42c1;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .table td, .table th {
      vertical-align: middle;
    }
    /* 헤더 좌우 정렬 */
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

      .page-link {
    color: black !important;
  }
  </style>
</head>
<body>
  <div class="container-fluid">
    
    <div class="row">
      
      <!-- Sidebar -->
        <div class="col-md-1 sidebar">
          <div th:replace="fragments/workerHeader :: workerHeader"></div>
       </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="row">

        <!-- Billing Info -->
        <div class="col-md-7">
          <h4 class="mb-4">Billing Info</h4>
          <form>
            <div class="mb-3">
              <label for="country" class="form-label">Country</label>
              <select class="form-select" id="country">
                <option selected>United Kingdom</option>
                <option>United States</option>
                <option>South Korea</option>
              </select>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Company Name</label>
              <input type="text" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" placeholder="Street address">
              <input type="text" class="form-control mt-2" placeholder="Apartment, suite, unit etc. (optional)">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Town / City</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Postcode / Zip</label>
                <input type="text" class="form-control">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">State / County</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control">
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="createAccount">
              <label class="form-check-label" for="createAccount">Create an account?</label>
            </div>

            <div class="mb-3">
              <label class="form-label">Order Notes</label>
              <textarea class="form-control" rows="3" placeholder="Notes about your order, e.g. special notes for delivery."></textarea>
            </div>
          </form>
        </div>

        <!-- Cart Summary -->
        <div class="col-md-4 offset-md-1">
          <h4 class="mb-4">Cart Totals</h4>
          <ul class="list-group mb-4">
            <li class="list-group-item d-flex justify-content-between">
              <span>Cart Subtotal</span>
              <strong>$100.00</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Shipping and Handling</span>
              <strong>Free Shipping</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Order Total</span>
              <strong>$100.00</strong>
            </li>
          </ul>

          <h5>Payment Method</h5>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="bank" checked>
            <label class="form-check-label" for="bank">
              Direct Bank Transfer
            </label>
            <div class="form-text">
              Make your payment directly into our bank account. Order won’t be shipped until funds clear.
            </div>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="cheque">
            <label class="form-check-label" for="cheque">
              Cheque Payment
            </label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="paymentMethod" id="paypal">
            <label class="form-check-label" for="paypal">
              PayPal
            </label>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms">
            <label class="form-check-label" for="terms">
              I have read and accept the <a href="#">Terms & Conditions</a>
            </label>
          </div>

          <button class="btn btn-dark w-100">Place Order</button>
        </div>

      </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
