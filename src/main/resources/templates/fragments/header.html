<!DOCTYPE html>
<style>
        body {
      margin: 0;

<html xmlns:th="http://www.thymeleaf.org">

      <a class="navbar-brand fw-bold" href="main.html">SOMHEADAL</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>

                <a href="https://www.instagram.com/somhaedal/" target="_blank" class="text-muted small">@somhaedal</a>
