<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact us</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background-color: #2f2f2f;
    color: #eee;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 4rem auto;
    padding: 2rem 3rem;
    background: #181818;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    display: flex;
    gap: 3rem;
    position: relative;
  }

  /* Left side */
  .left-section {
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    position: relative;
  }

  .logo {
    font-weight: 900;
    font-size: 1.5rem;
    color: white;
  }
  .logo span {
    color: #e02129;
  }

  .subtitle {
    color: #aaa;
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }

  h1 {
    font-size: 3rem;
    font-weight: 900;
    margin: 0 0 1rem 0;
    color: white;
  }

  /* Contact details */
  .contacts-info {
    display: flex;
    gap: 3rem;
    font-size: 0.85rem;
    color: #bbb;
  }

  .contacts-info > div {
    flex: 1;
  }

  .contacts-info div h4 {
    margin: 0 0 0.4rem 0;
    font-weight: 700;
    color: #eee;
  }

  /* Icons for labels */
  .contacts-info div h4::before {
    content: '';
    display: inline-block;
    margin-right: 0.6rem;
    vertical-align: middle;
    filter: invert(1);
  }

  .contacts-info div.address h4::before {
    content: url('data:image/svg+xml;utf8,<svg fill="white" height="14" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>');
  }
  .contacts-info div.phone h4::before {
    content: url('data:image/svg+xml;utf8,<svg fill="white" height="14" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.21c1.2.48 2.5.74 3.85.74a1 1 0 011 1v3.5a1 1 0 01-1 1A17 17 0 013 6a1 1 0 011-1h3.5a1 1 0 011 1c0 1.35.26 2.65.74 3.85a1 1 0 01-.21 1.11z"/></svg>');
  }
  .contacts-info div.email h4::before {
    content: url('data:image/svg+xml;utf8,<svg fill="white" height="14" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>');
  }

  /* Contact text lines */
  .contacts-info div p {
    margin: 0.1rem 0 0 0;
    line-height: 1.4;
    color: #ccc;
  }

  /* Get in touch label */
  .get-in-touch {
    display: flex;
    align-items: center;
    font-weight: 600;
    color: #e02129;
    font-size: 0.95rem;
    gap: 8px;
    margin-top: 3rem;
  }

  .get-in-touch::before {
    content: '';
    display: block;
    width: 3px;
    height: 20px;
    background: #e02129;
  }

  /* Next button */
  .next-button {
    margin-top: 3rem;
    align-self: flex-start;
    color: #eee;
    font-weight: 600;
    border: 2px solid #e02129;
    padding: 0.7rem 1.8rem;
    border-radius: 30px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    font-size: 1rem;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .next-button:hover {
    background: #e02129;
    color: white;
  }

  .next-button svg {
    margin-left: 0.8rem;
    fill: currentColor;
    width: 16px;
    height: 16px;
    transition: transform 0.3s ease;
  }

  .next-button:hover svg {
    transform: translateX(5px);
  }

  /* Right side - map */
  .right-section {
    flex: 1 1 55%;
    position: relative;
    background: url('https://maps.gstatic.com/tactile/basepage/pegman_sherlock.png') no-repeat center center;
    background-size: cover;
    border-radius: 10px;
  }

  .map-placeholder {
    width: 100%;
    height: 450px;
    background: url('https://maps.googleapis.com/maps/api/staticmap?center=55.76561,37.59416&zoom=14&size=800x450&markers=color:red%7C55.76561,37.59416&key=YOUR_API_KEY') no-repeat center center;
    background-size: cover;
    border-radius: 10px;
  }

  /* Pagination & section numbering */
  .page-indicator {
    position: absolute;
    top: 1rem;
    right: 2rem;
    color: #999;
    font-weight: 600;
    font-size: 0.9rem;
    user-select: none;
  }

  .page-indicator strong {
    color: white;
    font-weight: 900;
  }

  /* Right vertical menu */
  .right-menu {
    position: absolute;
    top: 50%;
    right: 2rem;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    color: #999;
    font-size: 0.85rem;
    user-select: none;
    font-weight: 600;
  }
  .right-menu div {
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .right-menu div.active,
  .right-menu div:hover {
    color: white;
  }
  .right-menu div.active::before {
    content: '•';
    color: #e02129;
    font-size: 1.5rem;
    display: inline-block;
    width: 1rem;
    margin-right: 0.5rem;
    vertical-align: middle;
  }

  /* Social icons bottom right */
  .social-icons {
    position: absolute;
    bottom: 1.5rem;
    right: 2rem;
    display: flex;
    gap: 1.5rem;
    color: #bbb;
  }
  .social-icons a {
    color: #bbb;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.3s ease;
  }
  .social-icons a:hover {
    color: #e02129;
  }

  /* Small label top left */
  .top-left-label {
    position: absolute;
    top: 1.5rem;
    left: 2rem;
    color: #bbb;
    font-size: 0.85rem;
    user-select: none;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .container {
      flex-direction: column;
      padding: 2rem 1.5rem;
      margin: 2rem auto;
    }
    .right-section {
      height: 350px;
      order: -1;
    }
    .left-section {
      flex: unset;
    }
    .page-indicator, .right-menu, .social-icons, .top-left-label {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="container">
    

  <div class="top-left-label">Contacts</div>

  <div class="left-section">

    <div class="logo">Darnit<span>2</span></div>
    <div class="subtitle">How to contact us</div>
    <h1>Contacts</h1>

    <div class="contacts-info">
      <div class="address">
        <h4>Address</h4>
        <p>Moscow, ul. Kalanchevskaya, 16,<br>p. 1 (BC Kalanchevskaya Plaza)</p>
      </div>
      <div class="phone">
        <h4>Phone</h4>
        <p>8 (495) 269-20-59</p>
      </div>
      <div class="email">
        <h4>E-mail</h4>
        <p>office@darnit2.ru</p>
      </div>
    </div>

    <div class="get-in-touch">Get in touch</div>

    <button class="next-button" aria-label="Next">
      Next
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5v10z"/></svg>
    </button>

  </div>

  <div class="right-section" role="img" aria-label="Map location">
    <!-- 실제 서비스에선 구글 맵 API 키 넣어 Static map 혹은 동적맵 넣으면 됩니다 -->
    <div class="map-placeholder"></div>
  </div>

  <div class="page-indicator"><strong>07</strong> / 07</div>

  <div class="right-menu" aria-label="Page navigation">
    <div>About company</div>
    <div>Our services</div>
    <div>Equipment</div>
    <div>Projects</div>
    <div>Licenses</div>
    <div class="active">Contacts</div>
  </div>

  <div class="social-icons">
    <a href="#" aria-label="Facebook">f Facebook</a>
    <a href="#" aria-label="Instagram"> Instagram</a>
  </div>

</div>

</body>
</html>
