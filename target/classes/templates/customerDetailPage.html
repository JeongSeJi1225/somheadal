<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>신청자 상세보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
      font-family: 'Noto Sans KR', sans-serif;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .sidebar {
      background-color: #111;
      color: #fff;
      padding-top: 2rem;
      text-align: center;
      min-height: 100vh;
    }
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .tab-content {
  background: #fff;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  height: auto; /* 콘텐츠 크기에 맞게 자동 조정 */
}

    .form-control-plaintext {
      background-color: #f9f9f9;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      color: #333;
    }
    .option-badge {
      display: inline-block;
      background-color: #444;
      color: white;
      border-radius: 12px;
      padding: 0.35rem 0.8rem;
      margin: 0.25rem;
      font-size: 0.9rem;
    }
    img {
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    img:hover {
      transform: scale(1.03);
    }

    /* 탭 클릭 시 색상 변화 */
    .nav-tabs .nav-link.active {
      color: #fff !important;
      background-color: dimgray !important;
    }
    .nav-tabs .nav-link {
      color: #6c757d;
    }
  </style>

  <script>
  function showAlert(message, type = "danger") {
    const alertBox = document.getElementById("deliveryAlert");
    alertBox.textContent = message;
    alertBox.className = `alert alert-${type} mt-2`; // Bootstrap 클래스 적용
    alertBox.classList.remove("d-none");

    // 3초 뒤 자동 사라짐
    setTimeout(() => {
      alertBox.classList.add("d-none");
    }, 3000);
  }

  function validateDeliveryNumber() {
    const input = document.getElementById("di_delivery_nb");
    const value = input.value.trim();

    // 1. 빈 값
    if (value === "") {
      showAlert("운송장 번호를 입력해 주세요.");
      input.focus();
      return false;
    }

    // 2. 숫자 이외 문자 포함
    const numberRegex = /^[0-9]+$/;
    if (!numberRegex.test(value)) {
      showAlert("운송장 번호는 숫자만 입력할 수 있습니다.");
      input.focus();
      return false;
    }

    // 3. 등록 확인
    if (!confirm("운송장 번호를 등록하시겠습니까?")) {
      showAlert("등록이 취소되었습니다.", "warning");
      return false;
    }

    // 통과 시 form 제출
    showAlert("운송장 번호가 등록됩니다.", "success");
    return true;
  }
</script>

</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-1 sidebar">
        <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <!-- 헤더 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold">신청자 상세보기</h3>
          <div>
            <span class="fw-semibold" th:text="${sessionAdmin}"></span>님, 오늘도 안전히 작업하세요.
          </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#info">신청자 정보</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#content">신청 내용</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#image">이미지 관리</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#delivery">배송</a></li>
        </ul>

        <!-- 탭 내용 -->
        <div class="tab-content">

          <!-- 신청자 정보 -->
          <div class="tab-pane fade show active" id="info">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">신청자명</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_name}">이름</p>
              </div>
              <div class="col-md-4">
                <label class="form-label">연락처</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_phone}">010-0000-0000</p>
              </div>
              <div class="col-md-4">
                <label class="form-label">택배</label>
                <p class="form-control-plaintext" th:text="${totalSums['do_name']}">택배</p>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col">
                <label class="form-label">주소</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_address}"></p>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col">
                <label class="form-label">운송장 번호</label>
                <p class="form-control-plaintext" th:text="${readCustomerDeliNb?.di_delivery_nb} ?: '아직 운송장 번호 없음'"></p>
              </div>
            </div>

            <form
                action="./insertCustomerDeliInfo"
                method="post"
                enctype="multipart/form-data"
                onsubmit="return validateDeliveryNumber()"
              >
                <input type="hidden" name="ct_id_pk" th:value="${customerReadApply.ct_id_pk}" />

                <div class="row mb-3">
                  <div class="col-md-9">
                    <input
                      class="form-control"
                      name="di_delivery_nb"
                      id="di_delivery_nb"
                      type="text"
                      placeholder="운송장 번호 입력"
                    />
                  </div>
                  <div class="col-md-3">
                    <button class="btn btn-success w-100" type="submit">배송완료</button>
                  </div>
                </div>

                <!-- 경고 메시지 표시 영역 -->
                <div id="deliveryAlert" class="alert mt-2 d-none" role="alert"></div>
              </form>


          </div>
            

          <!-- 신청 내용 -->
          <div class="tab-pane fade" id="content">
            <div class="row mb-3">
              <div class="col-md-3">
                <label class="form-label">타입</label>
                <p class="form-control-plaintext" th:text="${totalSums['mp_explain']}">타입</p>
              </div>
              <div class="col-md-3">
                <label class="form-label">개수</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_how_many}">개</p>
              </div>
              <div class="col-md-6">
                <label class="form-label">유료 옵션</label>
                <div>
                  <span th:each="opt : ${customerReadOptions}" class="option-badge">
                    <span th:text="${opt.po_name}">옵션명</span> (<span th:text="${opt.po_extra_price}">0</span>원)
                  </span>
                </div>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">신청일</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_apply_date.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd'))}"></p>
              </div>
              <div class="col-md-6">
                <label class="form-label">마감일</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_end_date.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd'))}"></p>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">작업 시 유의사항</label>
              <p class="form-control-plaintext" th:text="${customerReadApply.ct_memo}">메모</p>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">캐릭터 이름</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_char}">캐릭터</p>
              </div>
              <div class="col-md-6">
                <label class="form-label">캐릭터 설명</label>
                <p class="form-control-plaintext" th:text="${customerReadApply.ct_char_explain}">설명</p>
              </div>
            </div>

            <div>
              <label class="form-label">총 가격</label>
              <p class="form-control-plaintext fw-bold text-primary fs-5" th:text="${totalSums['total_price']}"></p>
            </div>
          </div>

          <!-- 이미지 관리 -->
          <div class="tab-pane fade" id="image">
            <div class="mb-3">
              <label class="form-label">자료 이미지</label>
              <div th:each="data : ${readCustomerImgData}">
                <img th:src="@{|/somUploadFiles/${data.ci_img_url}|}" alt="도안 이미지" class="img-fluid my-2" />
              </div>
            </div>

            <div class="row g-3 mt-5">
              <div class="col-md-4">
                <label class="form-label">도안 이미지</label>
                <input class="form-control" type="file" name="imageFiles" multiple>
                <a class="btn btn-primary w-100 mt-2" th:href="@{/updateDesignCf(ct_id_pk=${customerReadApply.ct_id_pk})}"><span th:text="${customerReadApply.ct_face_cf}"></span></a>
              </div>
              <div class="col-md-4">
                <label class="form-label">면피 이미지</label>
                <input class="form-control" type="file" name="imageFiles" multiple>
                <a class="btn btn-primary w-100 mt-2" th:href="@{/updateFaceCf(ct_id_pk=${customerReadApply.ct_id_pk})}"><span th:text="${customerReadApply.ct_design_cf}"></span></a>
              </div>
              <div class="col-md-4">
                <label class="form-label">완성 이미지</label>
                <input class="form-control" type="file" name="imageFiles" multiple>
                <a class="btn btn-primary w-100 mt-2" th:href="@{/updateCompleteCf(ct_id_pk=${customerReadApply.ct_id_pk})}"><span th:text="${customerReadApply.ct_complete_cf}"></span></a>
              </div>
            </div>
          </div>

          <!-- 배송 -->
          <div class="tab-pane fade" id="delivery">
            <div class="text-center py-5 text-muted">
              <p>배송 관련 정보가 이곳에 표시됩니다.</p>
            </div>
          </div>

        </div> <!-- tab-content 닫기 -->

        <!-- 하단 버튼 -->
        <div class="text-end mt-4">
          <a class="btn btn-secondary px-4" th:href="@{/customerEditPage(ct_id_pk=${customerReadApply.ct_id_pk})}">수정</a>
          <a class="btn btn-danger px-4" th:href="@{/deleteCustomerProcess(ct_id_pk=${customerReadApply.ct_id_pk})}">삭제<a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
