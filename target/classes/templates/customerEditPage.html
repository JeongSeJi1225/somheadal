<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>신청자 관리 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .sidebar {
      background-color: #111;
      color: #fff;
      padding-top: 2rem;
      text-align: center;
      min-height: 100vh;
    }
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-1 sidebar">
        <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="header-main">
          <h3 class="fw-bold">신청서 수정</h3>
          <div>
            <span class="fw-semibold" th:text="${sessionAdmin}"></span>
            <span>님 오늘도 안전히 작업하세요.</span>
          </div>
        </div>

        <form action="./customerEditProcess" method="post" enctype="multipart/form-data">
          <input type="hidden" name="ct_id_pk" th:value="${customerReadApply.ct_id_pk}" />

          <div class="row">
            <div class="col-md-10 offset-md-1"> 
              
              <!-- 신청자명 -->
              <div class="mb-4">
                <label class="form-label">신청자명</label>
                <input type="text" class="form-control" name="ct_name"
                       th:value="${customerReadApply?.ct_name} ?: ''"
                       th:placeholder="'신청자 닉네임 / 성함 입력'">
              </div>

              <!-- 연락처 -->
              <div class="mb-4">
                <label class="form-label">신청자 연락처</label>
                <input type="text" class="form-control" name="ct_phone"
                       th:value="${customerReadApply?.ct_phone} ?: ''"
                       th:placeholder="'숫자만 입력'">
              </div>

              <!-- 주소 -->
              <div class="mb-4">
                <label class="form-label">신청자 주소지</label>
                <input type="text" class="form-control" name="ct_address"
                       th:value="${customerReadApply?.ct_address} ?: ''"
                       th:placeholder="'배송받을 주소지 입력'">
              </div>

              <!-- 배송선택 -->
              <div class="mb-4">
                <label class="form-label">배송선택</label>
                <select class="form-select" name="ct_delivery_op">
                  <option selected disabled>배송옵션을 선택하세요.</option>
                  <option th:each="deli : ${deliverys}" 
                          th:value="${deli.do_id_pk}" 
                          th:text="${deli.do_name}"
                          th:selected="${customerReadApply?.ct_delivery_op == deli.do_id_pk}"></option>
                </select>
              </div>

              <!-- 타입지정 -->
              <div class="mb-4">
                <label class="form-label">타입지정</label>
                <select class="form-select" name="ct_type">
                  <!-- 현재 타입 표시 -->
                  

                  <!-- 나머지 타입 목록 -->
                  <option th:each="choiceProduct : ${readProducts}"
                          th:if="${choiceProduct.mp_id_pk != customerReadApply?.ct_type}"
                          th:value="${choiceProduct.mp_id_pk}"
                          th:text="${choiceProduct.mp_explain}">
                  </option>
                </select>
              </div>


              <!-- 개수 -->
              <div class="mb-4">
                <label class="form-label">개수</label>
                <input type="text" class="form-control" name="ct_how_many"
                       th:value="${customerReadApply?.ct_how_many} ?: ''"
                       th:placeholder="'숫자만 입력'">
              </div>
              

              <!-- 유료옵션 체크박스 -->
              <div class="mb-4">
              <label class="form-label">유료옵션</label>
              <div class="row">
                <div class="col-6 mb-2" th:each="op : ${readOptions}">
                  <div class="form-check">
                    <input class="form-check-input"
                          type="checkbox"
                          th:id="'check_' + ${op.po_id_pk}"
                          th:value="${op.po_id_pk}"
                          name="ct_option[]"
                          th:checked="${customerOptionList?.contains(op.po_id_pk)}">
                    <label class="form-check-label" th:for="'check_' + ${op.po_id_pk}">
                      <span th:text="${op.po_name}"></span>
                      (<span th:text="${op.po_extra_price}"></span> 원)
                    </label>
                  </div>
                </div>
              </div>
            </div>


              <!-- 작업 시 유의사항 -->
              <div class="mb-4">
                <label class="form-label">작업 시 유의사항</label>
                <textarea class="form-control" name="ct_memo"
                          th:text="${customerReadApply?.ct_memo} ?: ''"
                          placeholder="작업관련 메모" rows="3"></textarea>
              </div>

              <!-- 자료 이미지 등록 -->
              <div class="mb-4">
                <label class="form-label">자료 이미지 등록</label>
                <input class="form-control" type="file" name="imageFiles" multiple>
              </div>

              <!-- 캐릭터 관련 -->
              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">캐릭터 이름</label>
                  <input type="text" class="form-control" name="ct_char"
                         th:value="${customerReadApply?.ct_char} ?: ''"
                         th:placeholder="'캐릭터 이름 입력'">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">캐릭터 관련 설명</label>
                  <textarea class="form-control" name="ct_char_explain"
                            th:text="${customerReadApply?.ct_char_explain} ?: ''"
                            placeholder="작업관련 메모" rows="3"></textarea>
                </div>
              </div>

              <!-- 신청/마감 날짜 -->
              <div class="row mb-4">
                <div class="col">
                  <label class="form-label">신청날짜</label>
                  <input type="datetime-local" name="ct_apply_date"
                         th:value="${customerReadApply?.ct_apply_date} ?: ''" required>
                </div>
                <div class="col">
                  <label class="form-label">마감날짜</label>
                  <input type="datetime-local" name="ct_end_date"
                         th:value="${customerReadApply?.ct_end_date} ?: ''" required>
                </div>
              </div>

              <button type="submit" class="btn btn-dark w-100 my-3 mb-4">신청서 등록</button>

            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
