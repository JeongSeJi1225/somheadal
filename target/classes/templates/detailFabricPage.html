<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>원단 상세보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
    height: 100%;
    margin: 0;
    padding: 0;
    }
    .sidebar {
  background-color: #111;
  color: #fff;
  padding-top: 2rem;
  text-align: center;
  min-height: 100vh;
}
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const previewMap = {
        fb_name: 'previewName',
        fb_color: 'previewColor',
        fb_type : 'previewType',
        fb_thickness: 'previewThickness',
        fb_price: 'previewPrice',
        fb_source_supply : 'previewSupply',
        fb_location : 'previewLocation'
      };

      Object.entries(previewMap).forEach(([inputName, previewId]) => {
        const input = document.querySelector(`[name="${inputName}"]`);
        const preview = document.getElementById(previewId);

        if (input && preview) {
          input.addEventListener('input', function () {
            preview.textContent = input.value || '-';
          });
        }
      });
    });


    document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
    }
  });

  </script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-1 sidebar">
        <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="header-main">
          <h3 class="fw-bold">원단상세보기</h3>
          <div>
            <span class="fw-semibold" th:text="${sessionAdmin}">홍길동</span>
            <span>님 오늘도 안전히 작업하세요.</span>
          </div>
        </div>

        <!-- form  -->
        <form action="./editFabricProcess" method="post" enctype="multipart/form-data">
          <input type="hidden" name="seq_num" th:value="${sessionAdminPk}" />
          <div class="row">
            <!-- 왼쪽 입력 영역 -->
            <div class="col-md-7">
              <div class="mb-4">
                <label class="form-label">스와치 이미지</label>
                        <!--시험 -->
                    <img th:src="@{'/somUploadFiles/' + ${fabric.fb_swatch_img_path}}">
                        <!--ㅇㅇ-->>
              </div>
              <div class="mb-4">
                <label class="form-label">원단명</label>
                <input type="text" class="form-control"  name="fb_name" th:value="${fabric.fb_name}" >
              </div>
              <div class="mb-4">
                <label class="form-label">원단 재질</label>
                <input type="text" class="form-control"  name="fb_type" th:value="${fabric.fb_type}" >
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">가로 폭</label>
                  <input type="text" class="form-control" name="fb_width" th:value="${fabric.fb_width}">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">세로 폭</label>
                  <input type="text" class="form-control" name="fb_height" th:value="${fabric.fb_height}">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">컬러계열 선택</label>
                
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단두께</label>
                  <input type="text" class="form-control" name="fb_thickness" th:value="${fabric.fb_thickness}">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단위치</label>
                  <input type="text" class="form-control" name="fb_location"   th:value="${fabric.fb_location}">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">공급처 및 단가</label>
                <input type="text" class="form-control" name="fb_source_supply"  th:value="${fabric.fb_source_supply}">
                <input type="text" class="form-control mt-2" name="fb_price" th:value="${fabric.fb_price}">
              </div>

              <div class="mb-4">
                <label class="form-label">공급처 및 단가</label>
                <div class="col">
                    <button  class="btn btn-outline-dark w-100" onclick="history.back()" >목록으로</button>
                  </div>
                  <div class="col">
                    <a th:href="@{/editFabrics}" class="btn btn-dark w-100" >수정하기</a>
                  </div>
              </div>

            </div>

            <!-- 오른쪽 Preview 영역 -->
            <div class="col-md-5">
              <div class="p-4">
                <h4 class="mb-4">Swatch Image</h4>
                  <img th:src="@{'/somUploadFiles/' + ${fabric.fb_swatch_img_path}}">
                <div class="row" style="margin-top: 0.9em;">
                  <div class="col">
                    <button  class="btn btn-outline-dark w-100" onclick="history.back()" >목록으로</button>
                  </div>
                  <div class="col">
                    <a th:href="@{/editFabrics}" class="btn btn-dark w-100" >수정하기</a>
                  </div>
                </div>
              </div>
            </div>


          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
