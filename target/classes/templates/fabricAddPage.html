<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>원단관리 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f7fb;
    height: 100%;
    margin: 0;
    padding: 0;
    }
    .sidebar {
  background-color: #111;
  color: #fff;
  padding-top: 2rem;
  text-align: center;
  min-height: 100vh;
}
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const previewMap = {
        fb_name: 'previewName',
        fb_color: 'previewColor',
        fb_type : 'previewType',
        fb_thickness: 'previewThickness',
        fb_price: 'previewPrice',
        fb_source_supply : 'previewSupply',
        fb_location : 'previewLocation'
      };

      Object.entries(previewMap).forEach(([inputName, previewId]) => {
        const input = document.querySelector(`[name="${inputName}"]`);
        const preview = document.getElementById(previewId);

        if (input && preview) {
          input.addEventListener('input', function () {
            preview.textContent = input.value || '-';
          });
        }
      });
    });
  </script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-1 sidebar">
        <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="header-main">
          <h3 class="fw-bold">원단등록</h3>
          <div>
            <span class="fw-semibold" th:text="${adminName}">홍길동</span>
            <span>님 오늘도 안전히 작업하세요.</span>
          </div>
        </div>

        <!-- form  -->
        <form action="./fabricAddProcess" method="post" enctype="multipart/form-data">
          <div class="row">
            <!-- 왼쪽 입력 영역 -->
            <div class="col-md-7">
              <div class="mb-4">
                <label class="form-label">원단명</label>
                <input type="text" class="form-control" name="fb_name" placeholder="원단명 입력">
              </div>
              <div class="mb-4">
                <label class="form-label">원단 재질</label>
                <select class="form-select" name="fb_name" >
                  <option selected disabled>원단 재질을 선택하세요.</option>
                  <option th:each="choiceType : ${fabricCategoryName}"
                          th:value="${choiceType.fc_id_pk}"
                          th:text="${choiceType.fc_ct_name}">
                  </option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">가로 폭</label>
                  <input type="text" class="form-control" name="fb_width" placeholder="가로 cm 입력">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">세로 폭</label>
                  <input type="text" class="form-control" name="fb_height" placeholder="세로 cm 입력">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">컬러계열 선택</label>
                <select class="form-select" name="fb_color">
                  <option selected>컬러계열 선택</option>
                  <option value="Red">빨강</option>
                  <option value="Orange">주황</option>
                  <option value="Yellow">노랑</option>
                  <option value="Green">초록</option>
                  <option value="Blue">파랑</option>
                  <option value="Navy">남색</option>
                  <option value="Purple">보라</option>
                  <option value="White">흰색</option>
                  <option value="Gray">회색</option>
                  <option value="Black">검정</option>
                </select>
              </div>

              <div class="row">
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단두께</label>
                  <input type="text" class="form-control" name="fb_thickness" placeholder="원단두께 입력">
                </div>
                <div class="col-md-6 mb-4">
                  <label class="form-label">원단위치</label>
                  <input type="text" class="form-control" name="fb_location" placeholder="원단 위치 입력">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label">공급처 및 단가</label>
                <input type="text" class="form-control" name="fb_source_supply" placeholder="공급처 명 입력">
                <input type="text" class="form-control mt-2" name="fb_price" placeholder="공급처 단가 입력">
              </div>

              <div class="mb-3">
                <label class="form-label">스와치 이미지 등록</label>
                <input class="form-control" type="file" name="fb_swatch_img">
              </div>
            </div>

            <!-- 오른쪽 Preview 영역 -->
            <div class="col-md-5">
              <div class="p-4">
                <h4 class="mb-4">Preview Summary</h4>
                <ul class="list-group mb-4">
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Fabric Name</span>
                    <strong id="previewName">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Fabric Type</span>
                    <strong id="previewType">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Fabric Color</span>
                    <strong id="previewColor">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Fabric thickness</span>
                    <strong id="previewThickness">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Fabric Price</span>
                    <strong id="previewPrice">-</strong>
                  </li>
                </ul>

                <h5>Another information</h5>
                <div class="check mb-2">
                  <div class="row">
                    <div class="col">
                      <label class="form-check-label">
                        <span><i class="bi bi-check"></i></span> 공급처 업체
                      </label>
                    </div>
                    <div class="col">
                      <strong id="previewSupply"></strong>
                    </div>
                  </div>
                </div>
                <div class="check mb-3">
                  <div class="row">
                    <div class="col">
                      <label class="form-check-label">
                        <span><i class="bi bi-check"></i></span> 위치
                      </label>
                    </div>
                    <div class="col">
                      <strong id="previewLocation"></strong>
                    </div>
                  </div>
                </div>

  
                <button type="submit" class="btn btn-dark w-100">Fabric Add</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
