<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>원단관리 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
     body {
      background-color: #f4f7fb;
    height: 100%;
    margin: 0;
    padding: 0;
    }
    .sidebar {
  background-color: #111;
  color: #fff;
  padding-top: 2rem;
  text-align: center;
  min-height: 100vh;
}
    .sidebar a i {
      color: white;
      display: block;
      margin: 2.5rem auto;
      font-size: 2rem;
    }
    .sidebar a:hover i {
      color: #84aed7;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      background-color: #fff;
      color: #000;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .table td, .table th {
      vertical-align: middle;
    }

 
  </style>
</head>
<body>
  <div class="container-fluid">
    
    <div class="row">
      
      <!-- Sidebar -->
    <div class="col-md-1 sidebar">
      <div th:replace="~{fragments/workerHeader :: workerHeader}"></div>
      
    </div>

      <!-- Main Content -->
      <div class="col-md-11 p-4">
        <div class="header-main">
          <h3 class="fw-bold">원단관리 대시보드</h3>
          <div class="fw-semibold" th:text="${sessionAdmin}"></div><span>님 오늘도 안전히 작업하세요.</span>
        </div>

        <!-- 요약 카드 -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="card p-3">
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted">총 원단 종류</span>
                <i class="bi bi-layers fs-4 text-primary"></i>
              </div>
              <h5 class="mt-2 fw-bold" th:text="${countFabrics}">34</h5>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted">입고 완료</span>
                <i class="bi bi-check-circle fs-4 text-success"></i>
              </div>
              <h5 class="mt-2 fw-bold" th:text="${countStocks}">22</h5>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted">입고 대기</span>
                <i class="bi bi-clock-history fs-4 text-warning"></i>
              </div>
              <h5 class="mt-2 fw-bold" th:text="${countStocksWait}">12</h5>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card p-3">
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted">전체 재고량</span>
                <i class="bi bi-boxes fs-4 text-info"></i>
              </div>
              <h5 class="mt-2 fw-bold" th:text="${sumFabrics}">980 m</h5>
            </div>
          </div>
        </div>

        
        <!-- 카테고리 + 검색/버튼 -->
        <div class="row mt-3">
          <div class="col fw-bold px-2 py-2 mb-3">
            <div class="d-flex justify-content-between align-items-center">
              
              <!-- 탭 -->
              <ul class="nav nav-tabs">
                <!-- 전체보기 탭 -->
                <li class="nav-item">
                  <a class="nav-link"
                    th:classappend="${selectedType} == null ? 'active text-black' : 'text-secondary'"
                    th:href="@{/fabricManagerPage}">
                    전체보기
                  </a>
                </li>

                <!-- 카테고리별 탭 -->
                <li class="nav-item" th:each="fabricType : ${fabricCategoryName}">
                  <a class="nav-link"
                    th:classappend="${selectedType} == ${fabricType.fc_id_pk} ? 'active text-black' : 'text-secondary'"
                    th:href="@{/fabricManagerPage(type=${fabricType.fc_id_pk})}"
                    th:text="${fabricType.fc_ct_name}">
                  </a>
                </li>
              </ul>




              <!-- 검색 + 버튼 -->
              <div class="d-flex align-items-center gap-2">
                <form class="d-flex" role="search" style="width: 300px;">
                  <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                  <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <a class="btn btn-warning" th:href="@{/fabricAddPage}">원단추가</a>
              </div>

            </div>
          </div>
        </div>
        <!--/검색,버튼-->



        <!-- 테이블 -->
        <div class="card p-3">
          
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>스와치</th>
                <th>원단명</th>
                <th>색상</th>
                <th>재고</th>
                <th>입고처</th>
                <th>편집</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="fabric : ${readFabricAdds}">
                <td><img th:src="@{'/somUploadFiles/' + ${fabric.fb_swatch_img_path}}" alt="원단 이미지" width="40" height="40" class="rounded" /></td>
                <td>
                  <a th:href="@{'/detailFabricPage?fb_id_pk=' + ${fabric.fb_id_pk}}" style="color: inherit; text-decoration: none;">
                    <span th:text="${fabric.fb_name}"></span>
                  </a>
                </td>
                <td th:text="${fabric.fb_color}"></td>
                <td th:text="${fabric.fb_width + ' x ' + fabric.fb_height}"></td>
                <td th:text="${fabric.fb_source_supply}">130</td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/detailFabricPage}" >Edit</a></td>
              </tr>
            </tbody>
          </table>
        </div>
        <!--/테이블-->

        <!--페이지네이션-->
        <nav aria-label="Page navigation example pagelist">
          <ul class="pagination justify-content-center my-3">
            <li class="page-item ">
              <a class="page-link" href="#" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span>
              </a>
            </li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
              <a class="page-link" href="#" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
              </a>
            </li>
          </ul>
          </nav>
        <!--/페이지네이션-->
      </div>

    </div>
  </div>
</div>
</body>
</html>
