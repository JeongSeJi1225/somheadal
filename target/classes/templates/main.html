<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>솜해달</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Hand:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #e4e8f0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2em;
      background: white;
      border-radius: 15px;
    }

    .hero {
      font-size: 3em;
      font-weight: 900;
      margin-bottom: 1em;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 250px;
      gap: 1em;
    }

    @media (max-width: 992px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 576px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .item {
      background: #ccc;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5em;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 0.9em;
    }

    .tall {
      grid-row: span 2;
      grid-column: span 1;
    }

    .wide {
      grid-column: span 3;
      grid-row: span 1.8;
    }

    @media (max-width: 992px) {
      .wide {
        grid-column: span 2;
        grid-row: span 1.5;
      }
    }

    @media (max-width: 576px) {
      .tall,
      .wide {
        grid-column: span 1;
        grid-row: auto;
      }
    }

    .blue-btn {
      position: absolute;
      top: 1em;
      right: 1em;
      background: #7393b3;
      color: white;
      border: none;
      padding: 0.5em 1em;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9em;
    }

    @media (max-width: 576px) {
      .blue-btn {
        top: auto;
        bottom: 1em;
        right: 1em;
        font-size: 0.85em;
      }
    }

    .hashtag {
      font-size: 1.1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div th:replace="fragments/header :: mainHeader"></div>

    <div class="hero" style="margin-top: 1em;">SOMHEADAL</div>

    <div class="grid">
      <!-- 나머지 컨텐츠 유지 -->
      <div class="item tall">
        <img src="img/main.jpg" alt="Main Doll" />
        <div class="overlay">
          <div># My cute doll!</div>
          <div>Look at this lovely and cute thing</div>
        </div>
      </div>

      <div class="item wide">
        <img src="img/sew.jpg" alt="Collection" />
        <a th:href="@{/howwork}" class="blue-btn">How work</a>
      </div>

      <div class="item">
        <a th:href="@{/fnq}" style="text-decoration: none; color: inherit;">
          <img src="img/test1.jpg" alt="Shoe" />
          <div class="overlay">
            # FAQ
            <div>Frequently Asked Questions</div>
          </div>
        </a>
      </div>

      <div class="item">
        <a th:href="@{/product}" style="text-decoration: none; color: inherit;">
          <img src="img/teru.jpg" alt="Shoe" />
          <div class="overlay">
            # NEW ARRIVALS
            <span style="background: #7393b3; padding: 0.2em 0.5em; border-radius: 4px; margin-left: 0.2em; float: right;">Popular</span>
            <div>The new Teruterubozue</div>
          </div>
        </a>
      </div>

      <div class="item">
        <a href="https://crepe.cm/@somhaedal" style="text-decoration: none; color: inherit;">
          <img src="img/mainBanner1.png" alt="Shoe" />
          <div class="overlay">
            42+<br />Show review's in Crepe
          </div>
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
