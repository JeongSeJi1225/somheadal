<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작업자 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff;
      color: #222;
    }

    .login-container {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }

    .login-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }

    .form-control {
      background-color: #f5f5f5;
      border: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
    }

    .login-btn {
      background-color: #333;
      color: white;
      border: none;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .login-options {
      font-size: 0.9rem;
      color: #888;
    }

    .login-options a {
      color: #888;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .sns-title {
      margin: 2rem 0 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    .sns-icons i {
      font-size: 1.2rem;
      margin: 0 0.5rem;
      cursor: pointer;
      color: #000;
      text-align: center;
    }

    .footer {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 3rem;
      text-align: center;
    }

    a {
  text-decoration: none !important;
    }

  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container">
    로그인 실패 ㅗ 꺼져

  </div>
</body>
</html>
