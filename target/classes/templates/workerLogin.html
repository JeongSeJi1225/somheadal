<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작업자 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff;
      color: #222;
    }

    .login-container {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }

    .login-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }

    .form-control {
      background-color: #f5f5f5;
      border: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
    }

    .login-btn {
      background-color: #333;
      color: white;
      border: none;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .login-options {
      font-size: 0.9rem;
      color: #888;
    }

    .login-options a {
      color: #888;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .sns-title {
      margin: 2rem 0 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    .sns-icons i {
      font-size: 1.2rem;
      margin: 0 0.5rem;
      cursor: pointer;
      color: #000;
      text-align: center;
    }

    .footer {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 3rem;
      text-align: center;
    }

    a {
  text-decoration: none !important;
    }

  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container">
    <div th:replace="~{fragments/header :: mainHeader}"></div>
    <div class="row">
       <div class="login-container">
        <form action="./adminLoginProcess" method="post" enctype="multipart/form-data">
          <div class="login-title">LOGIN</div>
          <input type="text" name="admin_id" class="form-control" placeholder="아이디를 입력하세요">
          <input type="password" name="admin_passwd" class="form-control" placeholder="비밀번호를 입력하세요">
          <button class="login-btn" type="submit">LOGIN</button>
        </form>  

          <div class="sns-title">작업자 전용 로그인</div>
          <div class="row my-2">
            <div class="col" style="text-align: center;">
              Please contact here
            </div>
          </div>
          <div class="sns-icons">
            <a href="https://www.instagram.com/somhaedal/" target="_blank" class=" text-dark">
              <i class="bi bi-instagram"></i>
            </a>
            <a href="https://x.com/somhaedal" target="_blank" class=" text-dark">
              <i class="bi bi-twitter-x"></i>
            </a>
            <a href="https://open.kakao.com/me/somhaedal" target="_blank" class=" text-dark">
              <i class="bi bi-chat-dots"></i>
            </a>
          </div>

          <div class="footer mt-5">
            © SOMHEADAL All rights reserved.
          </div>
        </div>
    </div>

  </div>
</body>
</html>
